name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install streamlit-wakeup
        run: pip install streamlit-wakeup

      - name: Wake up Streamlit app
        run: |
          streamlit-wakeup "https://leadflow-crm.streamlit.app/"